name: Build APK

on:
  push:
    branches: [main]
    tags: ['O*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug (fast, debuggable) or release (minified "standalone" build type)'
        type: choice
        options: [debug, release]
        default: debug
      owpengram_build:
        description: 'Release number (the N in tag ON); 0 = local/dev build without self-update'
        default: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  BUILD_TOOLS_VERSION: 36.0.0
  PLATFORM_VERSION: android-36

jobs:
  apk:
    name: Standalone APK (${{ github.event.inputs.build_type || (startsWith(github.ref, 'refs/tags/O') && 'release') || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # wallet-engine keeps iOS snapshot PNGs in LFS; the Android build needs none of them.
      GIT_LFS_SKIP_SMUDGE: '1'
      BUILD_TYPE: ${{ github.event.inputs.build_type || (startsWith(github.ref, 'refs/tags/O') && 'release') || 'debug' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;${{ env.PLATFORM_VERSION }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Resolve release number
        id: version
        env:
          INPUT_BUILD: ${{ github.event.inputs.owpengram_build }}
        run: |
          number="${INPUT_BUILD:-0}"
          if [[ "$GITHUB_REF" == refs/tags/O* ]]; then
            number="${GITHUB_REF#refs/tags/O}"
          fi
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::OWPENGRAM_BUILD must be a whole number, got '$number'"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Both build types of :TMessagesProj_AppStandalone sign with
      # TMessagesProj/config/release.keystore, which is gitignored. With the
      # RELEASE_KEYSTORE_BASE64 secret set (plus RELEASE_STORE_PASSWORD,
      # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) the APK carries the real
      # signature and installs over an existing OwpenGram. Without it -- forks,
      # pull requests -- a throwaway key is generated so the APK still builds,
      # but it cannot update an install signed with the real key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          keystore=TMessagesProj/config/release.keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set -- signing with a throwaway key."
            keytool -genkeypair -noprompt -keystore "$keystore" -storetype JKS \
              -alias androidkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OwpenGram CI, O=OwpenGram"
          fi

      - name: Build
        run: |
          if [ "$BUILD_TYPE" = release ]; then variant=Standalone; dir=standalone; else variant=Debug; dir=debug; fi
          echo "APK_PATH=TMessagesProj_AppStandalone/build/outputs/apk/afat/$dir/app.apk" >> "$GITHUB_ENV"
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            -POWPENGRAM_BUILD=${{ steps.version.outputs.number }} \
            -POWPENGRAM_PUBLIC_HOST="${{ vars.OWPENGRAM_PUBLIC_HOST }}" \
            -POWPENGRAM_APP_LINKS_VERIFIED="${{ vars.OWPENGRAM_APP_LINKS_VERIFIED }}" \
            :TMessagesProj_AppStandalone:assembleAfat$variant

      - name: Rename APK
        id: apk
        run: |
          name="owpengram-${BUILD_TYPE}-O${{ steps.version.outputs.number }}-${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp "$APK_PATH" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14
